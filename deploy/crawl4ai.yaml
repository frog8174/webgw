# Upstream crawl4ai service. ClusterIP only -- never exposed outside the cluster.
#
# It has no authentication, no SSRF admission checks and no rate limiting
# (startup log: per_principal=unlimited). All three live in the webgw layer, so
# only webgw should ever reach this.
#
# Change before use: both values in the Secret.
---
apiVersion: v1
kind: Secret
metadata:
  name: crawl4ai-secrets
type: Opaque
stringData:
  # Without this, 0.9.2 binds only the container's loopback: the readiness probe
  # fails forever, the pod never becomes Ready, and the Service gets no endpoint.
  api-token: "CHANGE_ME"
  # Must be >= 32 characters, or the gunicorn worker crashes every two seconds.
  # Generate with: openssl rand -hex 32
  secret-key: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai
spec:
  replicas: 1
  selector:
    matchLabels: { app: crawl4ai }
  template:
    metadata:
      labels: { app: crawl4ai }
    spec:
      # Disable the Service environment variables Kubernetes injects.
      #
      # Kubernetes inherits early Docker behaviour: for every Service in the
      # namespace it injects a set of <SERVICE_NAME>_PORT style variables into
      # every pod. With a Service named crawl4ai that means
      #   CRAWL4AI_PORT=tcp://10.x.x.x:11235
      # and crawl4ai itself uses CRAWL4AI_PORT to choose its listening port. Once
      # overwritten, gunicorn parses that URL as a port number and dies at
      # startup:
      #   Error: 'tcp://10.105.110.45:11235' is not a valid port number.
      #
      # This affects environment injection only; DNS is untouched, so
      # http://crawl4ai:11235 keeps working.
      enableServiceLinks: false
      containers:
        - name: crawl4ai
          # Tag and digest together: the tag is readable, the digest is
          # immutable. The pull follows the digest, so republishing the tag
          # cannot change what runs.
          #
          # Do not use :latest -- as of 2026-09-01 :latest had already moved off
          # this digest to sha256:84751dab..., so :latest pulls an untested build.
          image: unclecode/crawl4ai:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11235
          env:
            - name: CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef: { name: crawl4ai-secrets, key: api-token }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: crawl4ai-secrets, key: secret-key }
            - name: CRAWL4AI_HOOKS_ENABLED
              value: "false"
          volumeMounts:
            # Chromium needs shared memory. A container's default /dev/shm is
            # only 64MB, which makes tabs crash at random -- the most common
            # headless browser failure on Kubernetes. `docker run` solves it with
            # --shm-size=1g; on Kubernetes it takes this emptyDir.
            - name: dshm
              mountPath: /dev/shm
          # startupProbe exists for slow-starting containers. Until it passes,
          # neither readiness nor liveness runs -- which grants ample startup
          # time without loosening the liveness thresholds (loosening those
          # would slow down detection of a genuine hang).
          #
          # crawl4ai's startup sequence: redis -> gunicorn -> building the
          # Playwright browser pool (the log shows "Creating permanent default
          # browser"). A cold start can take a minute or two.
          # 30 x 10s tolerates up to 5 minutes.
          startupProbe:
            httpGet: { path: /health, port: 11235 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            # Probed at the pod IP, not from localhost inside the container, and
            # that distinction matters: the image's built-in HEALTHCHECK curls
            # localhost, so it passes even when the service is bound to loopback
            # only. Probing from outside is what actually verifies reachability.
            httpGet: { path: /health, port: 11235 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 11235 }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            # The image's health check warns when available memory drops below
            # 2GB. The /dev/shm emptyDir counts against this limit, so 4Gi leaves
            # roughly 3Gi usable.
            limits:   { cpu: "2000m", memory: "4Gi" }
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      # No persistent volume, deliberately. crawl4ai's own SQLite cache has no
      # TTL and no size cap and grows until the disk fills; not persisting it
      # sidesteps that entirely. Persistence is webgw's job (14-day retention,
      # 2GB ceiling, LRU eviction).
---
apiVersion: v1
kind: Service
metadata:
  name: crawl4ai
spec:
  # ClusterIP: reachable only from inside the cluster. webgw uses
  # http://crawl4ai:11235.
  type: ClusterIP
  selector: { app: crawl4ai }
  ports:
    - port: 11235
      targetPort: 11235
      protocol: TCP
