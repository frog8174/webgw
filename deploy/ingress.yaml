# Ingress with HTTPS. Optional, but recommended -- over plain HTTP the Bearer
# token travels in clear text and anyone capturing traffic on the same segment
# can read it.
#
# Three things to do before applying:
#   1. Change the domain name (in two places: tls.hosts and rules.host)
#   2. Add that domain to MCP_ALLOWED_HOSTS in the ConfigMap -- the Host header
#      becomes the domain name, and omitting it makes everything return 421
#   3. Provision a TLS certificate (cert-manager, or create the Secret by hand)
#
# No SSE-related proxy buffering settings are needed: MCP_JSON_RESPONSE defaults
# to 1, so responses are plain JSON with no long-lived streaming.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webgw
  annotations:
    # A fetch times out at 30 seconds, and queueing behind the concurrency limit
    # can push past nginx's 60 second default.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"

    # Restrict to specific source ranges. Uncomment and set your own range to
    # confine access to the local network.
    # nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.0.0/16"

    # Uncomment for automatic certificates via cert-manager, and set your own
    # ClusterIssuer name.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webgw.example.com          # <- change to your domain
      secretName: webgw-tls          # cert-manager creates this; otherwise create it first
  rules:
    - host: webgw.example.com        # <- change to your domain
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: webgw
                port:
                  number: 8080
          # /healthz is deliberately left out -- probes run inside the cluster
          # and do not need the Ingress. One fewer public endpoint is one fewer
          # thing to probe.
