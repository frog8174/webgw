# webgw NodePort 部署範本。
#
# 套用順序:先 crawl4ai.yaml,等它 Ready 之後再套這份。
#
# 使用前必改的三處:
#   1. Secret 的 crawl4ai-token —— 要與 crawl4ai.yaml 的 api-token 相同
#   2. Secret 的 webgw-auth-token —— 客戶端要帶的 Bearer token
#   3. MCP_ALLOWED_HOSTS —— 必須包含 <節點IP>:<nodePort>,否則 DNS rebinding
#      防護會把所有請求擋成 421。這是最容易踩的坑。
#
# 網路隔離見 networkpolicy.yaml(選用,但建議)。
---
apiVersion: v1
kind: Secret
metadata:
  name: webgw-secrets
type: Opaque
stringData:
  crawl4ai-token: "CHANGE_ME"
  # MCP 規格:伺服器 SHOULD 對所有連線實作認證。
  # 留空的話 gateway 會拒絕綁 0.0.0.0,Service 將無法轉發。
  webgw-auth-token: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webgw-config
data:
  # 叢集內的 Service DNS。crawl4ai 用 ClusterIP,不對外暴露。
  # 跨 namespace 時寫全名:http://crawl4ai.<namespace>.svc.cluster.local:11235
  CRAWL4AI_BASE_URL: "http://crawl4ai:11235"
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "8080"
  SELECT_BUDGET_TOKENS: "4000"
  PASSTHROUGH_MAX_TOKENS: "4000"
  FETCH_TIMEOUT_S: "30"
  # 改成你的節點 IP 與 nodePort。可列多個,逗號分隔。
  MCP_ALLOWED_HOSTS: "192.168.1.60:30080,localhost,127.0.0.1"
  CACHE_PATH: "/data/cache.sqlite3"
  CACHE_RETENTION_DAYS: "14"
  CACHE_DEFAULT_MAX_AGE_S: "86400"
  CACHE_DOMAIN_RULES: "technews.tw=3600,www.ithome.com.tw=3600"
  CACHE_MAX_BYTES: "2147483648"
  CACHE_CLEANUP_INTERVAL_S: "3600"
  # stateless 會讓客戶端取不到工具清單(實測 OpenCode),保持關閉。
  MCP_STATELESS: "0"
  MAX_CONCURRENT_FETCHES: "4"
  RATE_LIMIT_PER_MINUTE: "60"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgw-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # 需大於 CACHE_MAX_BYTES,並預留 SQLite WAL 與 vacuum 的額外空間。
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgw
spec:
  # 注意:PVC 是 ReadWriteOnce,快取為 SQLite 單檔,所以固定 1 副本。
  # 要水平擴展需改用 RWX 儲存或外部快取後端。
  replicas: 1
  selector:
    matchLabels: { app: webgw }
  template:
    metadata:
      labels: { app: webgw }
    spec:
      containers:
        - name: webgw
          # 已推送至 Docker Hub。若要固定版本,改用 digest:
          #   abc99012/webgw@sha256:baf6e1b1a5dec9a997660441e8f2ef0a8020ea5fbb2e91e21f01bf9440a75558
          image: abc99012/webgw:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cache
              mountPath: /data
          envFrom:
            - configMapRef: { name: webgw-config }
          env:
            - name: CRAWL4AI_TOKEN
              valueFrom:
                secretKeyRef: { name: webgw-secrets, key: crawl4ai-token }
            - name: WEBGW_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: webgw-secrets, key: webgw-auth-token }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # /data 是掛載卷,可寫
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: webgw-cache
---
apiVersion: v1
kind: Service
metadata:
  name: webgw
spec:
  type: NodePort
  selector: { app: webgw }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
