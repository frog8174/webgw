# webgw NodePort deployment template.
#
# Apply order: crawl4ai.yaml first, then this once crawl4ai is Ready.
#
# Three things must be changed before use:
#   1. Secret crawl4ai-token -- must match api-token in crawl4ai.yaml
#   2. Secret webgw-auth-token -- the Bearer token clients will present
#   3. MCP_ALLOWED_HOSTS -- must contain <node IP>:<nodePort>, or DNS rebinding
#      protection rejects every request with 421. This is the easiest trap here.
#
# For network isolation see networkpolicy.yaml (optional, but recommended).
---
apiVersion: v1
kind: Secret
metadata:
  name: webgw-secrets
type: Opaque
stringData:
  crawl4ai-token: "CHANGE_ME"
  # The MCP specification says servers SHOULD authenticate all connections.
  # Left empty, the gateway refuses to bind 0.0.0.0 and the Service has nothing
  # to forward to.
  webgw-auth-token: "CHANGE_ME"
  # Only needed with a commercial reranking service (Cohere, Jina, Voyage).
  # Self-hosted vLLM does not need it.
  # reranker-api-key: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webgw-config
data:
  # In-cluster Service DNS. crawl4ai is ClusterIP and is never exposed.
  # Across namespaces, use the full name:
  #   http://crawl4ai.<namespace>.svc.cluster.local:11235
  CRAWL4AI_BASE_URL: "http://crawl4ai:11235"
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "8080"
  SELECT_BUDGET_TOKENS: "8000"
  PASSTHROUGH_MAX_TOKENS: "4000"
  FETCH_TIMEOUT_S: "30"
  # Change to your node IP and nodePort. Multiple entries, comma separated.
  MCP_ALLOWED_HOSTS: "192.168.1.60:30080,localhost,127.0.0.1"
  CACHE_PATH: "/data/cache.sqlite3"
  CACHE_RETENTION_DAYS: "14"
  CACHE_DEFAULT_MAX_AGE_S: "86400"
  CACHE_DOMAIN_RULES: "technews.tw=3600,www.ithome.com.tw=3600"
  CACHE_MAX_BYTES: "2147483648"
  CACHE_CLEANUP_INTERVAL_S: "3600"
  # Stateless leaves clients unable to retrieve the tool list (measured with
  # OpenCode). Keep it off.
  MCP_STATELESS: "0"
  MAX_CONCURRENT_FETCHES: "4"
  # Retrieval: bm25 (fast, about 2.5s) | rerank (accurate, about 5-8s).
  # Measured over 30 cases, rank@1: bm25 24/30, rerank 28/30.
  # There is no auto mode -- no signal predicts when BM25 is wrong.
  RETRIEVAL_MODE: "bm25"
  # Use the in-cluster Service, not a public ingress -- going through the
  # ingress is blocked by the NetworkPolicy and takes the long way round
  # (pod -> out of the cluster -> back in). Change to your reranker Service name.
  RERANKER_URL: "http://bge-reranker:8000"
  RERANKER_MODEL: "bge-reranker-v2-m3"
  RERANK_TOP_N: "30"
  RERANK_TIMEOUT_S: "15"
  MAX_SECTION_FRAC: "0.35"
  RATE_LIMIT_PER_MINUTE: "60"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgw-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Must exceed CACHE_MAX_BYTES, with headroom for the SQLite WAL and vacuum.
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgw
spec:
  # Note: the PVC is ReadWriteOnce and the cache is a single SQLite file, so
  # this is pinned to 1 replica. Scaling out requires RWX storage or an external
  # cache backend.
  replicas: 1
  selector:
    matchLabels: { app: webgw }
  template:
    metadata:
      labels: { app: webgw }
    spec:
      # Disable the Service environment variables Kubernetes injects.
      #
      # Kubernetes inherits early Docker behaviour: for every Service in the
      # namespace it injects a set of <SERVICE_NAME>_PORT style variables into
      # every pod. With a Service named crawl4ai that means
      #   CRAWL4AI_PORT=tcp://10.x.x.x:11235
      # and crawl4ai itself uses CRAWL4AI_PORT to choose its listening port. Once
      # overwritten, gunicorn parses that URL as a port number and dies at
      # startup:
      #   Error: 'tcp://10.105.110.45:11235' is not a valid port number.
      #
      # This affects environment injection only; DNS is untouched, so
      # http://crawl4ai:11235 keeps working.
      enableServiceLinks: false
      # fsGroup must sit at pod level -- the container-level securityContext has
      # no such field.
      #
      # A freshly mounted PVC is owned by root while the container runs as uid
      # 10001, so by default it cannot write:
      #   sqlite3.OperationalError: unable to open database file
      #
      # fsGroup makes the kubelet change the volume's group to this value and set
      # setgid, which is what lets the non-root process write.
      #
      # Note: Docker named volumes inherit the ownership of that directory in the
      # image, so local compose never reproduces this. Kubernetes PVCs do not --
      # they override the image's directory permissions outright.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: webgw
          # Tag plus digest: the tag is readable, the digest guarantees this
          # exact build is what runs.
          image: abc99012/webgw:0.3.1@sha256:1d69c5f5057145acb9df3f1637159de0467691710d9817a7a395c01d157954d9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cache
              mountPath: /data
          envFrom:
            - configMapRef: { name: webgw-config }
          env:
            - name: CRAWL4AI_TOKEN
              valueFrom:
                secretKeyRef: { name: webgw-secrets, key: crawl4ai-token }
            - name: WEBGW_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: webgw-secrets, key: webgw-auth-token }
            # Only for a commercial reranking service. An API key belongs in the
            # Secret, never in the ConfigMap.
            # - name: RERANKER_API_KEY
            #   valueFrom:
            #     secretKeyRef: { name: webgw-secrets, key: reranker-api-key }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # /data is a mounted volume and stays writable
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: webgw-cache
---
apiVersion: v1
kind: Service
metadata:
  name: webgw
spec:
  type: NodePort
  selector: { app: webgw }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
