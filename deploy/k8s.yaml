# webgw NodePort 部署範本。
#
# 使用前必改的兩處:
#   1. Secret 裡的 crawl4ai-token
#   2. MCP_ALLOWED_HOSTS —— 必須包含 <節點IP>:<nodePort>,否則 DNS rebinding
#      防護會把所有請求擋成 421。這是最容易踩的坑。
---
apiVersion: v1
kind: Secret
metadata:
  name: webgw-secrets
type: Opaque
stringData:
  crawl4ai-token: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webgw-config
data:
  # crawl4ai 在區網的位址
  CRAWL4AI_BASE_URL: "http://192.168.1.50:11235"
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "8080"
  SELECT_BUDGET_TOKENS: "4000"
  PASSTHROUGH_MAX_TOKENS: "4000"
  FETCH_TIMEOUT_S: "30"
  # 改成你的節點 IP 與 nodePort。可列多個,逗號分隔。
  MCP_ALLOWED_HOSTS: "192.168.1.60:30080,localhost,127.0.0.1"
  CACHE_PATH: "/data/cache.sqlite3"
  CACHE_RETENTION_DAYS: "14"
  CACHE_DEFAULT_MAX_AGE_S: "86400"
  CACHE_DOMAIN_RULES: "technews.tw=3600,www.ithome.com.tw=3600"
  CACHE_MAX_BYTES: "2147483648"
  CACHE_CLEANUP_INTERVAL_S: "3600"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgw-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # 需大於 CACHE_MAX_BYTES,並預留 SQLite WAL 與 vacuum 的額外空間。
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgw
spec:
  # 注意:PVC 是 ReadWriteOnce,快取為 SQLite 單檔,所以固定 1 副本。
  # 要水平擴展需改用 RWX 儲存或外部快取後端。
  replicas: 1
  selector:
    matchLabels: { app: webgw }
  template:
    metadata:
      labels: { app: webgw }
    spec:
      containers:
        - name: webgw
          # 已推送至 Docker Hub。若要固定版本,改用 digest:
          #   abc99012/webgw@sha256:409e1ccd441c466ad75cea4c369df65de09d30b2222f3c9d58dadbfc894d36e5
          image: abc99012/webgw:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cache
              mountPath: /data
          envFrom:
            - configMapRef: { name: webgw-config }
          env:
            - name: CRAWL4AI_TOKEN
              valueFrom:
                secretKeyRef: { name: webgw-secrets, key: crawl4ai-token }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # /data 是掛載卷,可寫
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: webgw-cache
---
apiVersion: v1
kind: Service
metadata:
  name: webgw
spec:
  type: NodePort
  selector: { app: webgw }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
