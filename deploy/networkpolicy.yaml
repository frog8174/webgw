# Network isolation: an egress firewall that blocks private ranges at the
# container layer.
#
# This is the third line of SSRF defence. The first two are:
#   1. webgw's admission.py -- resolves DNS and checks every returned address
#      before dispatching
#   2. crawl4ai 0.9.2's egress pinning proxy -- built in upstream
#
# Why three: upstream has a track record of "the check exists but one path does
# not apply it", with four consecutive CVEs across 0.8.7-0.9.0. The first two
# layers are application-level string and address checks; this one is enforced
# in the network and cannot be bypassed.
#
# Prerequisite: the cluster CNI must support NetworkPolicy (Calico, Cilium, and
#   similar). Flannel does not by default -- applying this succeeds but does
#   nothing, which gives a false sense of security. Verify first: check that
#   `kubectl get networkpolicy` lists it, and confirm by test that a private
#   address really is blocked.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawl4ai-isolation
spec:
  podSelector:
    matchLabels: { app: crawl4ai }
  policyTypes: [Ingress, Egress]

  ingress:
    # Accept connections from webgw only. Every other pod in the cluster is
    # refused.
    - from:
        - podSelector:
            matchLabels: { app: webgw }
      ports:
        - port: 11235
          protocol: TCP

  egress:
    # DNS must be allowed, or no domain resolves at all.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Outbound crawling: the whole internet is allowed, minus every private
    # range. This defeats "public URL 302s into the internal network" at the
    # network layer -- even if an application-level check has a gap, the packet
    # cannot leave.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8        # RFC1918 (usually also the cluster pod/service range)
              - 172.16.0.0/12     # RFC1918
              - 192.168.0.0/16    # RFC1918
              - 169.254.0.0/16    # link-local, includes cloud metadata 169.254.169.254
              - 127.0.0.0/8       # loopback
              - 100.64.0.0/10     # CGNAT, used by some cloud internal services
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webgw-egress
spec:
  podSelector:
    matchLabels: { app: webgw }
  policyTypes: [Egress]
  egress:
    # webgw only needs crawl4ai, the reranker and DNS. It never fetches web
    # pages directly itself.
    - to:
        - podSelector:
            matchLabels: { app: crawl4ai }
      ports:
        - port: 11235
          protocol: TCP
    # The reranking service. Use the *in-cluster Service*, never a public
    # ingress -- going through the ingress is blocked by this very policy, and
    # it is the long way round: pod -> out of the cluster -> DNS -> back in
    # through the ingress.
    #
    # Note: the port here is the **targetPort on the pod**, not the Service
    #   port. A Service is only a forwarder: the packet is sent to the Service's
    #   8080 and arrives at the pod as 8000. NetworkPolicy runs before the packet
    #   enters the pod, so what it sees is 8000.
    #
    #   That means the two places carry different port numbers, which is
    #   counterintuitive:
    #     RERANKER_URL in the ConfigMap -> Service port, http://<svc>:8080
    #     ports here                    -> targetPort, 8000
    #
    #   Getting this wrong presents as a **timeout**, not connection refused --
    #   the packet is dropped by the rule, so the connection hangs until the
    #   client times out after 15 seconds and degrades to bm25.
    #
    # Confirm the real values with:
    #   kubectl get svc <svc> -o jsonpath='{.spec.ports[*].targetPort}'
    #   kubectl get pod --show-labels | grep rerank
    - to:
        - podSelector:
            matchLabels: { app: bge-reranker-v2-m3-vllm }
      ports:
        - port: 8000        # targetPort, not the Service's 8080
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
