[project]
name = "webgw"
version = "0.3.1"
description = "Query-aware web fetch gateway for local LLM agents (OpenCode / MCP)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "uvicorn>=0.30",
    # Traditional/Simplified normalization. Measured across 12 Chinese cases:
    # 4 improved, 8 unchanged, 0 regressed.
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webgw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
