services:
  webgw:
    build: .
    image: webgw:0.2.0
    container_name: webgw
    ports:
      # 本機測試綁 loopback。上線時由 k8s Service (NodePort) 處理對外暴露,
      # 容器本身仍然只監聽 0.0.0.0:8080。
      - "127.0.0.1:8080:8080"
    environment:
      # 本機測試:crawl4ai 跑在宿主機上,從容器內要走 host.docker.internal。
      # 之後 crawl4ai 移到區網,改成 http://<區網IP>:11235 即可,程式不用動。
      CRAWL4AI_BASE_URL: "${CRAWL4AI_BASE_URL:-http://host.docker.internal:11235}"
      CRAWL4AI_TOKEN: "${CRAWL4AI_TOKEN:?請在 .env 設定 CRAWL4AI_TOKEN}"
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      SELECT_BUDGET_TOKENS: "${SELECT_BUDGET_TOKENS:-4000}"
      PASSTHROUGH_MAX_TOKENS: "${PASSTHROUGH_MAX_TOKENS:-4000}"
      FETCH_TIMEOUT_S: "${FETCH_TIMEOUT_S:-30}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      CACHE_PATH: "/data/cache.sqlite3"
      CACHE_RETENTION_DAYS: "${CACHE_RETENTION_DAYS:-14}"
      CACHE_DEFAULT_MAX_AGE_S: "${CACHE_DEFAULT_MAX_AGE_S:-86400}"
      CACHE_DOMAIN_RULES: "${CACHE_DOMAIN_RULES:-}"
      CACHE_MAX_BYTES: "${CACHE_MAX_BYTES:-2147483648}"
      CACHE_CLEANUP_INTERVAL_S: "${CACHE_CLEANUP_INTERVAL_S:-3600}"
      # stateless 會讓客戶端取不到工具清單(實測 OpenCode),保持關閉。
      MCP_STATELESS: "${MCP_STATELESS:-0}"
      WEBGW_AUTH_TOKEN: "${WEBGW_AUTH_TOKEN:-}"
      MAX_CONCURRENT_FETCHES: "${MAX_CONCURRENT_FETCHES:-4}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
    extra_hosts:
      # Linux 上 host.docker.internal 預設不存在,補上以保持跨平台一致。
      - "host.docker.internal:host-gateway"
    volumes:
      - webgw-cache:/data
    restart: unless-stopped

volumes:
  webgw-cache:
